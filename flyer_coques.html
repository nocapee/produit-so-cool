<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flyer Coques</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Rajdhani', sans-serif;
  }

  .flyer {
    width: 700px;
    background: #0d0d0d;
    border: 1px solid #222;
    position: relative;
    overflow: hidden;
    padding: 48px 40px 44px;
  }

  /* Background glow blobs */
  .flyer::before {
    content: '';
    position: absolute;
    top: -120px; left: -120px;
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(180,80,255,0.18) 0%, transparent 70%);
    pointer-events: none;
  }
  .flyer::after {
    content: '';
    position: absolute;
    bottom: -100px; right: -100px;
    width: 350px; height: 350px;
    background: radial-gradient(circle, rgba(255,100,40,0.13) 0%, transparent 70%);
    pointer-events: none;
  }

  /* HEADER */
  .header {
    text-align: center;
    margin-bottom: 10px;
    position: relative;
    z-index: 1;
  }

  .brand-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 8px;
    color: #b44eff;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 72px;
    line-height: 1;
    color: #fff;
    letter-spacing: 4px;
    text-transform: uppercase;
  }

  .title span {
    color: #b44eff;
  }

  .subtitle {
    font-size: 14px;
    letter-spacing: 5px;
    color: #666;
    text-transform: uppercase;
    margin-top: 6px;
  }

  /* DIVIDER */
  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, #b44eff, #ff6428, transparent);
    margin: 20px 0;
    position: relative;
    z-index: 1;
  }

  /* GRID */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    position: relative;
    z-index: 1;
    margin-bottom: 16px;
  }

  .card {
    background: #141414;
    border: 1px solid #252525;
    border-radius: 12px;
    overflow: hidden;
    transition: transform 0.2s;
    position: relative;
  }

  .card:hover {
    transform: translateY(-4px);
  }

  .card-img-wrap {
    width: 100%;
    aspect-ratio: 1/1.05;
    overflow: hidden;
    position: relative;
  }

  .card-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
  }

  .card-bottom {
    padding: 10px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid #222;
  }

  .card-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 2px;
    color: #fff;
  }

  .price-badge {
    background: linear-gradient(135deg, #b44eff, #ff6428);
    color: #fff;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 17px;
    letter-spacing: 1px;
    padding: 3px 10px;
    border-radius: 6px;
  }

  /* Bottom row — 2 cards centered */
  .grid-bottom {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    max-width: 430px;
    margin: 0 auto 20px;
    position: relative;
    z-index: 1;
  }

  /* FOOTER */
  .footer {
    text-align: center;
    position: relative;
    z-index: 1;
  }

  .footer-tag {
    display: inline-block;
    font-size: 12px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #444;
  }

  .footer-tag span {
    color: #b44eff;
  }

  .cta {
    margin-top: 12px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    letter-spacing: 6px;
    color: #fff;
    text-transform: uppercase;
  }

  .cta span {
    color: #ff6428;
  }

  /* corner accents */
  .corner {
    position: absolute;
    width: 30px; height: 30px;
    z-index: 2;
  }
  .corner-tl { top: 12px; left: 12px; border-top: 2px solid #b44eff; border-left: 2px solid #b44eff; }
  .corner-tr { top: 12px; right: 12px; border-top: 2px solid #b44eff; border-right: 2px solid #b44eff; }
  .corner-bl { bottom: 12px; left: 12px; border-bottom: 2px solid #ff6428; border-left: 2px solid #ff6428; }
  .corner-br { bottom: 12px; right: 12px; border-bottom: 2px solid #ff6428; border-right: 2px solid #ff6428; }
</style>
</head>
